# ============================================================================
#  RS OPTIMIZATION — configurare Netlify
#
#  Inlocuieste .htaccess (care e doar pentru Apache si nu face nimic pe Netlify).
#  Site-ul nu are build; npm install ruleaza doar pentru Netlify Function.
# ============================================================================

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --------------------------------------------------------------- securitate

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Panoul de administrare este protejat de functia serverless: parola se verifica
# pe server, din variabila de mediu ADMIN_PASSWORD. Nu are rost sa fie indexat.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# --------------------------------------------------------------------- cache

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS si JS NU au hash in nume, deci nu pot fi cache-uite lung: browserul ar
# ramane cu versiunea veche zile intregi dupa un deploy. "no-cache" nu inseamna
# "fara cache" — inseamna "verifica intai daca s-a schimbat"; daca nu s-a
# schimbat, Netlify raspunde 304 si nu se retransmite nimic.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# Fallback-ul static: se citeste doar cand nu exista inca nimic salvat in Blobs.
[[headers]]
  for = "/data/site.json"
  [headers.values]
    Cache-Control = "no-cache"

# --------------------------------------------------------------- blocari
#
# ATENTIE: nu pune aici o regula generala pentru /api/*, pentru ca ar acoperi
# si /api/config.php, ruta pe care raspunde Netlify Function-ul.

# Varianta PHP a colectarii de emailuri nu se foloseste pe Netlify — emailurile
# merg prin Netlify Forms. Blocam explicit ca sa cada rapid pe Forms.
[[redirects]]
  from = "/api/subscribe.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/_lib.php"
  to = "/404.html"
  status = 404
  force = true

# Logo-urile originale (4 MB) si scriptul de generare nu au ce cauta public.
[[redirects]]
  from = "/_source/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/site.json.bak"
  to = "/404.html"
  status = 404
  force = true

# Pagina de eroare
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
