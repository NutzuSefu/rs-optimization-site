<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator dashboard — RS OPTIMIZATION</title><link rel="stylesheet" href="assets/css/style.css?v=3"><link rel="stylesheet" href="assets/css/account.css?v=3"><style>
.creator-wrap{max-width:1080px;margin:0 auto;padding:56px 22px}.creator-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.creator-head h1{font:800 42px Oxanium;margin:6px 0}.creator-head p{color:#9d96b6}.creator-actions a{color:#ff9138}.creator-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}.creator-card{border:1px solid #302942;border-radius:16px;padding:20px;background:#15121f}.creator-card strong{display:block;font:800 30px Oxanium;color:#ff8d32}.creator-card span{color:#a8a0bf}.creator-panel{border:1px solid #302942;border-radius:16px;background:#15121f;padding:22px;margin-top:18px}.creator-panel h2{font:700 21px Oxanium;margin:0 0 16px}.creator-table{width:100%;border-collapse:collapse}.creator-table th,.creator-table td{text-align:left;padding:11px;border-bottom:1px solid #29243a}.creator-table th{color:#9d96b6}.creator-table td{color:#eeeaf8}@media(max-width:700px){.creator-grid{grid-template-columns:1fr}.creator-head{display:block}}
</style></head><body><main class="creator-wrap"><header class="creator-head"><div><div class="eyebrow">RS OPTIMIZATION · CREATOR PROGRAM</div><h1>Creator dashboard</h1><p>Vezi codurile, vânzările și comisioanele tale în timp real.</p></div><div class="creator-actions"><a href="account.html">← Contul meu</a></div></header><div id="creatorStatus" class="notice">Se verifică sesiunea…</div><section id="creatorContent" hidden><div class="creator-grid"><div class="creator-card"><strong id="codeCount">0</strong><span>Coduri active</span></div><div class="creator-card"><strong id="salesTotal">0,00 €</strong><span>Vânzări generate</span></div><div class="creator-card"><strong id="commissionTotal">0,00 €</strong><span>Comision acumulat</span></div></div><section class="creator-panel"><h2>Codurile mele</h2><div id="codes"></div></section><section class="creator-panel"><h2>Ultimele utilizări</h2><div id="redemptions"></div></section></section></main><script>
(function(){const API=window.RS_AUTH_API_URL||'https://rs-optimization-license-api.radu8781.workers.dev',KEY='rsopt.account.session',$=id=>document.getElementById(id),money=v=>(Number(v||0)/100).toFixed(2).replace('.',',')+' €';let token='';try{token=sessionStorage.getItem(KEY)||''}catch{}if(!token){$('creatorStatus').textContent='Trebuie să fii autentificat pentru a vedea dashboard-ul.';return}fetch(API+'/v1/creator/dashboard',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:'{}'}).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.message||'Sesiune expirată');return d})).then(d=>{if(!d.creator){$('creatorStatus').textContent='Contul tău nu are încă un cod de creator.';return}$('creatorStatus').hidden=true;$('creatorContent').hidden=false;const codes=d.codes||[],reds=d.redemptions||[];$('codeCount').textContent=codes.length;$('salesTotal').textContent=money(codes.reduce((a,c)=>a+Number(c.total_sales_cents||0),0));$('commissionTotal').textContent=money(codes.reduce((a,c)=>a+Number(c.total_commission_cents||0),0));$('codes').innerHTML='<table class="creator-table"><tr><th>Cod</th><th>Creat la</th><th>Vânzări</th><th>Comision</th></tr>'+codes.map(c=>'<tr><td><b>'+c.code+'</b></td><td>'+new Date(c.created_utc).toLocaleDateString('ro-RO')+'</td><td>'+money(c.total_sales_cents)+'</td><td>'+money(c.total_commission_cents)+'</td></tr>').join('')+'</table>';$('redemptions').innerHTML=reds.length?'<table class="creator-table"><tr><th>Cod</th><th>Ticket</th><th>Reducere</th><th>Comision</th></tr>'+reds.map(x=>'<tr><td>'+x.code+'</td><td>'+x.ticket_id+'</td><td>'+money(x.discount_cents)+'</td><td>'+money(x.commission_cents)+'</td></tr>').join('')+'</table>':'<p>Nu există utilizări încă.</p>'}).catch(e=>{$('creatorStatus').textContent=e.message||'Nu am putut încărca dashboard-ul.'})})();
</script></body></html>
