<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina nu există — RS OPTIMIZATION</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden; }
  .nf__orb { position: absolute; width: 640px; height: 640px; border-radius: 50%; filter: blur(110px);
             background: radial-gradient(circle, rgba(41,184,255,.32), transparent 70%); pointer-events: none; }
  .nf__box { position: relative; text-align: center; max-width: 520px; }
  .nf__logo { width: 200px; margin: 0 auto 28px; }
  .nf__code { font-family: var(--font-display); font-size: clamp(4.5rem, 16vw, 8rem); font-weight: 800;
              line-height: .9; letter-spacing: -.04em; margin-bottom: 10px; }
  .nf__box h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin-bottom: 14px; }
  .nf__box p { color: var(--text-2); margin-bottom: 30px; }
  .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="nf">
    <div class="nf__orb"></div>
    <div class="nf__box">
      <img class="nf__logo" src="/assets/img/rs-logo.png" alt="RS OPTIMIZATION">
      <div class="nf__code chrome">404</div>
      <h1 class="chrome">Pagina asta nu există</h1>
      <p>Ori linkul e greșit, ori pagina a fost mutată. Hai înapoi la început.</p>
      <div class="nf__actions">
        <a class="btn btn--primary" href="/">ÎNAPOI PE SITE</a>
        <a class="btn" href="/#shop">VEZI PACHETELE</a>
      </div>
    </div>
  </div>
</body>
</html>
